<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>💰 Finance Tracker</h1>

        <!-- Add Transaction Form -->
        <div class="form-section">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="type">Select Type</label>
                    <select id="type" required>
                        <option value="">Choose...</option>
                        <option value="income">Income 💵</option>
                        <option value="expense">Expense 💸</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Salary, Food, Shopping" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (Ksh)</label>
                    <input type="number" id="amount" placeholder="Enter amount" required>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" class="btn-add">Add Transaction</button>
            </form>
        </div>

        <!-- Summary Section -->
        <div class="summary-section">
            <h2>Summary</h2>
            <div class="summary-cards">
                <div class="card income-card">
                    <h3>Income</h3>
                    <p id="total-income">Ksh 0</p>
                </div>
                <div class="card expense-card">
                    <h3>Expense</h3>
                    <p id="total-expense">Ksh 0</p>
                </div>
                <div class="card balance-card">
                    <h3>Balance</h3>
                    <p id="balance">Ksh 0</p>
                </div>
            </div>
        </div>

        <!-- Transactions List -->
        <div class="transactions-section">
            <h2>Transactions</h2>
            <ul id="transaction-list" class="transaction-list">
                <li class="empty-message">No transactions yet. Add one above!</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
